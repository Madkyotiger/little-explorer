<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="探索岛">
<meta name="description" content="小小探索岛：家长手选的儿童科普视频，小动物、恐龙、细菌、游泳、跳舞。">
<title>小小探索岛</title>
<link rel="preload" as="image" href="assets/island.webp">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --tint:#ff3b7f; --tint-15:rgba(255,59,127,.13);
  --purple:#a259e6; --purple-15:rgba(162,89,230,.13);
  --green:#2fbf71; --green-15:rgba(47,191,113,.14);
  --label:#1d1d1f; --label2:rgba(60,60,67,.74); --label3:rgba(60,60,67,.36);
  --sep:rgba(60,60,67,.14);
  --bg:#f7f1fb; --surface:#fff; --fill:rgba(120,120,128,.12);
  --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.7);
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;min-height:100%;background:var(--bg)}
h1,h2,b,p,.lead{text-wrap:balance}
body{font-family:var(--font);color:var(--label);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
img{display:block;max-width:100%}
svg{display:block}
.app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(32px + var(--safe-b))}
[hidden]{display:none!important}
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:none}

/* ---------- 通用控件（iOS 风格） ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--glass-line),0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(80,40,120,.12)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:17px;letter-spacing:-.01em;transition:transform .12s,filter .12s;user-select:none}
.pill:active{transform:scale(.97);filter:brightness(.94)}
.pill.block{display:flex;width:100%}
.pill.filled{background:var(--tint);color:#fff}
.pill.filled.green{background:var(--green)}
.pill.filled.purple{background:var(--purple)}
.pill.tinted{background:var(--tint-15);color:var(--tint)}
.pill.tinted.purple{background:var(--purple-15);color:var(--purple)}
.pill.gray{background:var(--fill);color:var(--label)}
.pill.on{background:var(--tint);color:#fff}
.pill.sm{min-height:36px;padding:0 14px;font-size:15px}
.circle{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;flex:none;transition:transform .12s}
.circle:active{transform:scale(.92)}
.circle.tinted{background:var(--tint-15);color:var(--tint)}
.circle.gray{background:var(--fill);color:var(--label2)}
.circle.sm{width:32px;height:32px}
.circle.playing{animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.navbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px;
  background:rgba(247,241,251,.78);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--sep)}
.nav-back{display:inline-flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;font-weight:500;padding:6px 8px 6px 2px}
.nav-back .ic{width:22px;height:22px}
.float-back{position:absolute;left:12px;top:calc(12px + var(--safe-t));z-index:5;display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 14px 0 8px;border-radius:999px;color:var(--label);font-weight:600;font-size:16px}
.float-back .ic{width:20px;height:20px}
.large-title{display:flex;align-items:center;gap:12px;padding:6px 20px 4px}
.large-title h1{margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.02em;flex:1}
.section-h{margin:26px 20px 8px;font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.inset{margin:0 16px;background:var(--surface);border-radius:20px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;text-align:left;position:relative;color:inherit;text-decoration:none}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.cell .t{flex:1;min-width:0}
.cell .t b{display:block;font-weight:600}
.cell .t span{display:block;font-size:14px;color:var(--label2)}
.cell .chev{color:var(--label3);width:14px;height:14px}
.cell:active{background:rgba(0,0,0,.04)}
.footnote{font-size:13px;color:var(--label2);text-align:center;margin:18px 20px 0}
.footnote a{color:var(--label2)}

/* ---------- 岛 ---------- */
.island-wrap{position:relative;width:100%;aspect-ratio:1086/1448;overflow:hidden}
.island{width:100%;height:100%;object-fit:cover}
.island-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.title{position:absolute;left:0;right:0;top:calc(2.4% + var(--safe-t));margin:0;text-align:center;font-size:clamp(30px,8.6vw,48px);font-weight:800;letter-spacing:.04em;color:#fff;
  text-shadow:0 1px 2px rgba(150,60,140,.35),0 6px 22px rgba(190,80,170,.45)}
.spot{position:absolute;width:32%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:2}
.spot-label{position:absolute;left:50%;bottom:-1%;transform:translateX(-50%);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  height:34px;padding:0 14px;border-radius:999px;font-weight:700;font-size:clamp(15px,4.1vw,18px);color:var(--label);transition:transform .15s}
.spot:active .spot-label{transform:translateX(-50%) scale(.94)}
.spot .star{color:#ffb800;width:14px;height:14px}
.spot .sparkle{position:absolute;right:14%;top:12%;width:18px;height:18px;color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.9));animation:twinkle 2.6s infinite ease-in-out}
.spot:nth-of-type(2n) .sparkle{animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}

.notice{display:flex;align-items:center;gap:12px;margin:-46px 14px 0;position:relative;z-index:3;padding:12px;border-radius:26px;text-align:left;width:calc(100% - 28px);transition:transform .15s}
.notice:active{transform:scale(.98)}
.notice .av{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none;background:#fde7f3}
.notice .tx{flex:1;min-width:0}
.notice .tx .top{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2)}
.notice .tx .top b{color:var(--label);font-weight:600;font-size:14px}
.notice .tx .top i{margin-left:auto;font-style:normal}
.notice .tx p{margin:2px 0 0;font-weight:500;font-size:17px;line-height:1.3}
.notice .pt{width:62px;height:62px;flex:none;animation:bob 2.2s infinite ease-in-out}
.notice.done .pt{animation:none}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.home-list{margin-top:16px}
.home-list .cell img{width:40px;height:40px;object-fit:contain}

/* ---------- 地点页 ---------- */
.hero{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#efe4f7}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.place-head{margin-top:-30px;position:relative;z-index:2}
.place-head p{margin:0 20px;color:var(--label2);font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:18px 16px 4px}
.tile{text-align:left;display:flex;flex-direction:column;gap:7px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .cv{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#ece2f5;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(80,40,120,.10)}
.tile .cv img{width:100%;height:100%;object-fit:cover}
.tile .heart{position:absolute;left:7px;top:7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--tint)}
.tile .heart .ic{width:15px;height:15px}
.tile .cv .say-on{position:absolute;right:7px;bottom:7px;width:34px;height:34px;color:var(--tint)}
.tile .cv .say-on .ic{width:17px;height:17px}
.tile .meta{display:flex;align-items:flex-start;gap:8px}
.tile .meta .t{flex:1;min-width:0}
.tile .meta b{display:block;font-weight:500;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.tile .meta .t>span{display:block;font-size:13px;color:var(--label2);margin-top:2px}
.bottom-cta{padding:22px 16px 0}

/* ---------- 播放页 ---------- */
.player{width:100%;aspect-ratio:16/9;background:#1b1626;position:relative}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (min-width:601px){.player{border-radius:18px;overflow:hidden;margin-top:12px}}
.waiting{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:10px 14px;border-radius:20px;background:#fff}
.waiting img{width:52px;height:52px;flex:none}
.waiting p{margin:0;font-size:15px;color:var(--label2);line-height:1.4}
.waiting p b{color:var(--label);font-weight:600}
.watch-title{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 6px}
.watch-title h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.02em;flex:1}
.watch-title .sub{display:block;font-size:15px;font-weight:500;color:var(--label2);margin-top:4px;letter-spacing:0}
.actions{display:grid;gap:12px;padding:12px 16px 0}
.row{display:flex;gap:12px}
.row>*{flex:1}
.grown-h{margin:30px 20px 8px;font-size:15px;color:var(--label2);font-weight:500}
.grown-sec .cell .t b{font-size:15px}
.caution{color:#c26a00}

/* ---------- 底部弹层（iOS sheet） ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,10,30,.28);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:600px;background:var(--surface);border-radius:30px 30px 0 0;padding:8px 20px calc(22px + var(--safe-b));text-align:center;position:relative;animation:up .32s cubic-bezier(.2,.9,.3,1.05)}
@media (min-width:601px){.modal{align-items:center}.sheet{border-radius:30px;max-width:460px;padding-bottom:22px}}
@keyframes up{from{transform:translateY(100%)}}
.grabber{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.22);margin:0 auto 6px}
.sheet .x{position:absolute;right:14px;top:12px;z-index:2}
.sheet .grabber+.x+*{margin-top:34px}
.sheet .hero-pt{width:150px;height:150px;margin-left:auto;margin-right:auto;animation:bob 2.2s infinite ease-in-out}
.sheet h2{margin:6px 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.sheet .lead{font-size:19px;font-weight:500;line-height:1.5;margin:6px 4px 18px;color:var(--label)}
.sheet .stack{display:grid;gap:10px}
.sheet .note{font-size:14px;color:var(--label2);margin:14px 0 0}
.try-art{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:20px;margin-bottom:4px;background:#efe4f7}
.rec{width:110px;height:110px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;margin:10px auto 10px;box-shadow:0 10px 30px rgba(255,59,127,.35);transition:transform .12s}
.rec .ic{width:46px;height:46px}
.rec:active{transform:scale(.95)}
.rec.on{animation:pulse 1s infinite;background:#ff3b30;box-shadow:0 10px 30px rgba(255,59,48,.4)}
.rec-time{font-weight:600;color:var(--label2);min-height:1.5em;font-variant-numeric:tabular-nums}

/* ---------- 探索本 ---------- */
.book-top{display:flex;align-items:center;gap:14px;padding:10px 20px 0}
.book-top img{width:64px;height:64px;object-fit:contain}
.book-top h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;flex:1}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 16px;border-radius:20px;overflow:hidden}
.photos .ph{position:relative;aspect-ratio:1;background:#ece2f5}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.45));line-height:1.3}
.photos .ph .del{position:absolute;right:5px;top:5px;width:26px;height:26px;color:#fff;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.photos .ph .del .ic{width:12px;height:12px}
.empty{margin:0 16px;padding:22px 18px;border-radius:20px;background:var(--surface);color:var(--label2);font-size:16px;text-align:center;line-height:1.5}
.voice-cell .play{color:#fff;background:var(--tint)}
.voice-cell .del{color:var(--label3)}


/* ---------- 大人控制面板（系统设置风格，不用孩子那套） ---------- */
body.adm-on{background:#f2f2f7}
.adm{--ab:#007aff;--asep:rgba(60,60,67,.18);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;background:#f2f2f7;max-width:680px;margin:0 auto;padding-bottom:40px}
.adm h1,.adm b,.adm p{text-wrap:wrap}
.adm-link{display:inline-flex;align-items:center;gap:1px;color:var(--ab);font-size:17px;padding:6px 4px}
.adm-link .ic{width:22px;height:22px}
.adm-bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(6px + var(--safe-t)) 10px 6px;background:rgba(242,242,247,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.adm-h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 20px 6px}
.adm-gh{font-size:13px;color:rgba(60,60,67,.6);margin:24px 32px 7px;letter-spacing:.02em}
.adm-group{margin:0 16px;background:#fff;border-radius:12px;overflow:hidden}
.adm-row{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 16px;width:100%;font-size:17px;text-align:left;position:relative;color:#1d1d1f;text-decoration:none;background:#fff}
.adm-row+.adm-row::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--asep)}
.adm-row .l{flex:1;min-width:0}
.adm-row .l small{display:block;font-size:13px;color:rgba(60,60,67,.6);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .v{color:rgba(60,60,67,.6);font-variant-numeric:tabular-nums}
.adm-row .chev{width:13px;height:13px;color:rgba(60,60,67,.3)}
.adm-row.act{color:var(--ab)}
.adm-row.act.center{justify-content:center;font-weight:600}
.adm-row.act:disabled{color:rgba(60,60,67,.3)}
button.adm-row:active,a.adm-row:active{background:#e5e5ea}
.adm-row.field .l{flex:none;width:52px}
.adm-row.field input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;background:none;color:#1d1d1f;padding:4px 0}
.adm-row .trash{color:#ff3b30;padding:6px}
.adm-row .trash .ic{width:20px;height:20px}
.adm-foot{font-size:13px;line-height:1.45;color:rgba(60,60,67,.6);margin:7px 32px 0}
.adm-foot a{color:var(--ab)}
.adm-foot.fine{margin-top:18px;font-size:12px;color:rgba(60,60,67,.45)}
.adm-foot.err{color:#ff3b30}
.adm-foot.ok{color:#248a3d}
.stepper{display:inline-flex;background:rgba(118,118,128,.12);border-radius:8px;overflow:hidden;flex:none}
.stepper button{width:44px;height:32px;display:grid;place-items:center;color:#1d1d1f}
.stepper button+button{border-left:.5px solid rgba(60,60,67,.25)}
.stepper button:active{background:rgba(118,118,128,.24)}
.stepper .ic{width:16px;height:16px}
.adm-row .num{min-width:64px;text-align:right;color:rgba(60,60,67,.6);font-variant-numeric:tabular-nums}
.lock{min-height:100vh;display:flex;flex-direction:column;background:#f2f2f7}
.lock-back{align-self:flex-start;margin:calc(8px + var(--safe-t)) 0 0 10px}
.lock-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 10vh}
.lock-ic{width:34px;height:34px;color:#1d1d1f;margin-bottom:14px}
.lock h1{font-size:21px;font-weight:600;margin:0}
.lock p{font-size:14px;color:rgba(60,60,67,.6);margin:6px 0 0;min-height:20px}
.lock p.err{color:#ff3b30}
.dots{display:flex;gap:20px;margin:18px 0 40px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #1d1d1f}
.dots i.on{background:#1d1d1f}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.keys button{width:76px;height:76px;border-radius:50%;background:#fff;font-size:30px;font-weight:400;color:#1d1d1f;box-shadow:0 .5px 0 rgba(0,0,0,.08)}
.keys button:active{background:#d1d1d6}
.keys button.del{background:none;box-shadow:none;display:grid;place-items:center}
.keys button.del .ic{width:28px;height:28px}
.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translate(-50%,-140%);display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:80;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.3,1.1);max-width:90vw;color:var(--label)}
.toast:not(.show){opacity:0;visibility:hidden;transition:transform .35s,opacity .2s,visibility 0s .35s}
.toast.show{transform:translate(-50%,0)}
.toast .ic{color:var(--tint)}
/* 看完遮罩、时间 */
.endcover{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;
  background:linear-gradient(160deg,#fde7f3,#ede1fb);color:var(--label)}
.endcover img{width:clamp(64px,16%,120px);height:auto;border-radius:50%;background:#fff}
.endcover h2{margin:0;font-size:clamp(20px,4.6vw,30px);font-weight:700}
.endcover .row{width:min(100%,460px)}
.endcover .link{font-size:15px;color:var(--label2);text-decoration:underline;padding:4px 10px}
.timebar{display:flex;align-items:center;gap:8px;margin:12px 16px 0;font-size:14px;color:var(--label2)}
.timebar .ic{color:var(--purple)}
.rest-clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--purple);margin:2px 0 14px}
.spot.small{width:24%}
.island-wrap.wide{aspect-ratio:1672/941;width:min(100%,calc(78vh * 1672 / 941));margin:0 auto}
.island-wrap.wide .spot,.island-wrap.wide .spot.small{width:19%}
.island-wrap.wide .spot.small .spot-label{top:auto;bottom:-1%;transform:translateX(-50%)}
.island-wrap.wide .spot.small:active .spot-label{transform:translateX(-50%) scale(.94)}
.island-wrap.wide .title{top:calc(1.2% + var(--safe-t));font-size:clamp(30px,4.2vw,52px)}
.spot.small .spot-label{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.spot.small:active .spot-label{transform:translate(-50%,-50%) scale(.94)}
.spot.small .sparkle{right:-4%;top:-4%}
/* iPad 竖屏／横屏：放大，不再是一条手机窄栏 */
@media (min-width:700px){
  body{font-size:19px}
  .app{max-width:880px}
  .island-wrap{width:min(100%,calc(82vh * 1086 / 1448));margin:0 auto}
  .spot-label{font-size:20px;height:42px;padding:0 18px}
  .notice{width:min(calc(100% - 28px),680px);margin:-56px auto 0;padding:16px}
  .notice .tx p{font-size:20px}
  .notice .av{width:64px;height:64px}.notice .pt{width:80px;height:80px}
  .home-list{max-width:680px;margin-left:auto;margin-right:auto}
  .hero{aspect-ratio:21/8;border-radius:0 0 28px 28px}
  .large-title h1{font-size:40px}
  .tiles{grid-template-columns:repeat(3,1fr);gap:26px 18px;padding:22px 20px 4px}
  .tile .meta b{font-size:18px}

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (id, cls = '') => `<svg class="ic ${cls}"><use href="#i-${id}"/></svg>`;
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const VIDS = DATA.videos.filter(v => !v.dead);
const byId = Object.fromEntries(VIDS.map(v => [v.id, v]));
const PLACES = DATA.places;
const placeByCat = Object.fromEntries(PLACES.map(p => [p.cat, p]));
const placeById = Object.fromEntries(PLACES.map(p => [p.id, p]));
const placeOf = v => placeByCat[v.category];
// 大人在控制面板里加的视频：只存在这台设备（localStorage），排在该地点最前面
const CUSTOM_KEY = 'island-custom-v1';
let customs = store.get(CUSTOM_KEY, []).filter(v => v && v.id && placeByCat[v.category]);
customs.forEach(v => { VIDS.unshift(v); byId[v.id] = v; });
const mins = s => s ? `${Math.max(1, Math.round(s / 60))} 分钟` : '';
const ptImg = pt => `assets/pt-${pt.id}.webp`;

// ---------- 本机记录 ----------
const LIKE_KEY = 'picks-like-v1', VISIT_KEY = 'island-visited-v1', HELP_KEY = 'island-helped-v1';
const likes = store.get(LIKE_KEY, {});
const visited = store.get(VISIT_KEY, {});
const helped = store.get(HELP_KEY, {});
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const dayIndex = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const todaysPatient = () => DATA.patients[dayIndex() % DATA.patients.length];

// ---------- 语音 ----------
const audio = new Audio();
let sayingBtn = null, queued = null;
// 大人后加的视频没有录好的语音，用系统朗读（tts:文字）
const TTS = 'speechSynthesis' in window ? window.speechSynthesis : null;
function say(key, btn, then) {
  try { audio.pause(); } catch {}
  if (TTS) TTS.cancel();
  if (sayingBtn) sayingBtn.classList.remove('playing');
  sayingBtn = btn || null; queued = then || null;
  if (key.startsWith('tts:')) {
    if (!TTS) return;
    const u = new SpeechSynthesisUtterance(key.slice(4)); u.lang = 'zh-CN'; u.rate = .9;
    u.onend = u.onerror = () => { if (sayingBtn === btn && btn) btn.classList.remove('playing'); if (sayingBtn === btn) { sayingBtn = null; const q = queued; queued = null; if (q) q(); } };
    if (btn) btn.classList.add('playing');
    TTS.speak(u); return;
  }
  audio.src = key.startsWith('blob:') ? key : `audio/${key}.mp3`;
  const p = audio.play();
  if (btn) btn.classList.add('playing');
  if (p && p.catch) p.catch(() => { if (btn) btn.classList.remove('playing'); });
}
audio.addEventListener('ended', () => {
  if (sayingBtn) sayingBtn.classList.remove('playing');
  sayingBtn = null;
  const q = queued; queued = null; if (q) q();
});
function hush() { queued = null; try { audio.pause(); } catch {} if (TTS) TTS.cancel(); if (sayingBtn) sayingBtn.classList.remove('playing'); sayingBtn = null; }

let toastT;
function toast(msg, icon = 'check') { const t = $('#toast'); t.innerHTML = `${ic(icon)}<span>${esc(msg)}</span>`; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

// ---------- 探索本存储（IndexedDB，只在本机） ----------
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {

    ${ctx.img ? `<img class="hero-pt" src="${ctx.img}" alt="" style="width:110px;height:110px">` : ''}
    <h2>${esc(ctx.title)}</h2>
    ${canRecord ? `<button type="button" class="rec" id="rec-btn" aria-label="录音">${ic('mic')}</button><div class="rec-time" id="rec-time">点一下开始说，说完再点一下</div>` : `<p class="lead">这台设备不能录音，可以直接说给爸爸妈妈听哦。</p>`}
    <p class="note">录音只存在这台设备上。</p>`);
  say(ctx.line);
  if (canRecord) $('#rec-btn').onclick = () => rec ? stopRec(false) : startRec();
}
async function startRec() {
  hush();
  try { recStream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch { const t = $('#rec-time'); if (t) t.textContent = '没有拿到麦克风，可以请大人帮忙打开'; return; }
  const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const r = new MediaRecorder(recStream, type ? {mimeType: type} : undefined); rec = r; recChunks = [];
  r.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  r.onstop = async () => {
    if (recStream) recStream.getTracks().forEach(t => t.stop());
    recStream = null; rec = null;
    if (r._discard) return;
    const blob = new Blob(recChunks, {type: r.mimeType || 'audio/webm'});
    if (blob.size < 800) { const t = $('#rec-time'); if (t) t.textContent = '好像没录到，再试一次'; return; }
    try { await addWork({type: 'voice', blob, kind: recCtx.kind, label: recCtx.label, place: recCtx.place || ''}); }
    catch { const t = $('#rec-time'); if (t) t.textContent = '没存上，再录一次试试'; return; }
    closeModal(); toast('录好啦，放进探索本了');
    if (current.view === 'book') renderBook();
  };
  r.start(); recStart = Date.now();
  const b = $('#rec-btn'); b.classList.add('on'); b.innerHTML = ic('stop');
  recTimer = setInterval(() => { const s = Math.floor((Date.now() - recStart) / 1000); const t = $('#rec-time'); if (t) t.textContent = `正在录 0:${String(s).padStart(2, '0')}　说完点一下`; if (s >= 60) stopRec(false); }, 300);
}
function stopRec(discard) {
  clearInterval(recTimer);
  if (rec && rec.state !== 'inactive') { rec._discard = discard; rec.stop(); }
  else if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
}

// ---------- 探索本 ----------
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}月${d.getDate()}日`; };
let blobUrls = [];
async function renderBook() {
  $('#book-say').onclick = e => say('line-chest', e.currentTarget);
  blobUrls.forEach(u => URL.revokeObjectURL(u)); blobUrls = [];
  let works = [];
  try { works = await allWorks(); } catch {}
  const url = w => { const u = URL.createObjectURL(w.blob); blobUrls.push(u); return u; };
  const placeName = w => w.place && placeById[w.place] ? placeById[w.place].name : '';
  const photos = works.filter(w => w.type === 'photo');
  const voices = works.filter(w => w.type === 'voice');
  $('#book-photos').innerHTML = photos.length
    ? `<div class="photos">${photos.map(w => `<div class="ph"><img src="${url(w)}" alt=""><span class="cap">${fmtDate(w.at)}${placeName(w) ? ` · ${esc(placeName(w))}` : ''}</span><button type="button" class="circle del" data-del="${w.id}" aria-label="删除">${ic('x')}</button></div>`).join('')}</div>`
    : '<p class="empty">还空空的。去岛上点“我想试试”，做到了就拍张照放进来吧！</p>';
  const ask = `<button type="button" class="cell" id="wonder-btn"><span class="circle tinted sm">${ic('mic')}</span><span class="t"><b>我有一个问题</b><span>点一下，说给爸爸听</span></span><svg class="ic chev"><use href="#i-chev"/></svg></button>`;
  $('#book-wonders').innerHTML = ask + voices.map(w => `<div class="cell voice-cell"><button type="button" class="circle sm play" data-audio="${url(w)}" aria-label="播放">${ic('play')}</button><span class="t"><b>${esc(w.label || '录音')}</b><span>${fmtDate(w.at)}${placeName(w) ? ` · ${esc(placeName(w))}` : ''}</span></span><button type="button" class="circle sm del" data-del="${w.id}" aria-label="删除">${ic('trash')}</button></div>`).join('');
  $('#wonder-btn').onclick = () => openRecord({title: '我想知道……', line: 'line-wonder', kind: 'wonder', label: '我想知道'});
  const liked = VIDS.filter(v => likes[v.id]).sort((a, b) => likes[b.id] - likes[a.id]);
  $('#book-likes').innerHTML = liked.length ? `<div class="tiles" style="padding-top:0">${liked.map(tileHTML).join('')}</div>`
    : '<p class="empty">看到喜欢的视频，点“喜欢”，它就会住到这里。</p>';
  const t = $('#book-likes .tiles'); if (t) bindTiles(t);
}
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-audio]');
  if (a) { say(a.dataset.audio, a); return; }
  const d = e.target.closest('[data-del]');
  if (d && confirm('要从探索本里删掉这一个吗？')) { await delWork(+d.dataset.del); renderBook(); }
});

// ---------- 大人控制面板 ----------
let admOpen = false, pinMode = 'enter', pinBuf = '', pinFirst = '', pinThen = null;
function lockShow(mode, then) {
  pinMode = mode; pinBuf = ''; pinFirst = ''; pinThen = then || null;
  $('#adm-lock').hidden = false; $('#adm-panel').hidden = true; $('#adm-board').hidden = true;
  $('#lock-back span').textContent = mode === 'enter' || mode === 'first' ? '岛上' : '取消';
  lockText(mode === 'enter' ? '输入大人密码' : '设置大人密码', mode === 'enter' ? '' : '4 位数字，只存在这台设备上');
  paintDots();
}
function lockText(t, sub, err) { $('#lock-title').textContent = t; const p = $('#lock-sub'); p.textContent = sub || '\u00a0'; p.classList.toggle('err', !!err); }
function paintDots() { $$('#lock-dots i').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length)); }
function shake() { const d = $('#lock-dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
function pinKey(k) {
  if ($('#adm-lock').hidden) return;
  if (k === 'del') { pinBuf = pinBuf.slice(0, -1); paintDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; paintDots();
  if (pinBuf.length < 4) return;
  const got = pinBuf;
  setTimeout(() => {
    pinBuf = '';
    if (pinMode === 'enter') {
      if (got === store.get(PIN_KEY, null)) { admOpen = true; renderGrownup(current.arg); }
      else { shake(); lockText('输入大人密码', '密码不对', true); paintDots(); }
    } else if (!pinFirst) { pinFirst = got; lockText('再输一次', '确认新密码'); paintDots(); }
    else if (got === pinFirst) { store.set(PIN_KEY, got); admOpen = true; const t = pinThen; renderGrownup(current.arg); if (t) t(); }
    else { pinFirst = ''; shake(); lockText('设置大人密码', '两次不一样，请重新设置', true); paintDots(); }
  }, 120);
}
$('#lock-keys').onclick = e => { const b = e.target.closest('[data-k]'); if (b) pinKey(b.dataset.k); };
document.addEventListener('keydown', e => { if (current.view !== 'grownup' || $('#adm-lock').hidden) return; if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); });
$('#lock-back').onclick = () => { if (admOpen) renderGrownup(current.arg); else go(''); };
$('#adm-lockbtn').onclick = () => { admOpen = false; renderGrownup(); };
$('#a-repin').onclick = () => lockShow('change', () => toast('密码改好了'));

const TIME_ROWS = [['session', '每段最多看', 5, 5, 60], ['rest', '每段之后休息', 5, 0, 60], ['weekday', '周一到周五每天', 10, 0, 240], ['weekend', '周六周日每天', 10, 0, 240]];
function paintTset() {
  const s = tnow(), left = Math.max(0, capToday() - s.used);
  $('#a-used').textContent = `${Math.round(s.used / 60)} 分钟${s.bonus ? `（加过 ${Math.round(s.bonus / 60)} 分钟）` : ''}`;
  $('#a-left').textContent = s.restUntil ? `正在休息，还剩 ${mmss((s.restUntil - Date.now()) / 1000)}` : `${Math.round(left / 60)} 分钟`;
  $('#t-unrest').hidden = !s.restUntil;
  $('#a-times').innerHTML = TIME_ROWS.map(([k, label]) => `<div class="adm-row"><span class="l">${label}</span><span class="num">${tset[k]} 分钟</span>
    <span class="stepper"><button type="button" data-step="${k}" data-d="-1" aria-label="减少">${ic('minus')}</button><button type="button" data-step="${k}" data-d="1" aria-label="增加">${ic('plus')}</button></span></div>`).join('');
}
$('#a-times').onclick = e => {
  const b = e.target.closest('[data-step]'); if (!b) return;
  const [k, , step, lo, hi] = TIME_ROWS.find(r => r[0] === b.dataset.step);
  tset[k] = Math.min(hi, Math.max(lo, tset[k] + step * +b.dataset.d));
  store.set(TSET_KEY, tset); paintTset();
};
$('#t-bonus').onclick = () => { const s = tnow(); s.bonus = (s.bonus || 0) + 900; s.restUntil = 0; s.sess = 0; store.set(TIME_KEY, s); paintTset(); toast('今天多了 15 分钟'); };
$('#t-unrest').onclick = () => { const s = tnow(); s.restUntil = 0; s.sess = 0; store.set(TIME_KEY, s); paintTset(); toast('休息结束'); };

function renderGrownup(arg) {
  if (!admOpen) return lockShow(store.get(PIN_KEY, null) ? 'enter' : 'first');
  $('#adm-lock').hidden = true;
  const p = placeById[arg];
  $('#adm-panel').hidden = !!p; $('#adm-board').hidden = !p;
  window.scrollTo(0, 0);
  if (p) return renderBoard(p);
  paintTset(); paintSync();
  $('#a-boards').innerHTML = PLACES.map(pl => {
    const all = VIDS.filter(v => v.category === pl.cat), mine = all.filter(v => v.custom).length;
    return `<button type="button" class="adm-row" data-go="grownup/${pl.id}"><span class="l">${esc(pl.name)}${mine ? `<small>我加了 ${mine} 个</small>` : ''}</span><span class="v">${all.length}</span><svg class="ic chev"><use href="#i-chev"/></svg></button>`;
  }).join('');
  $('#g-built').textContent = DATA.built ? `内置清单 ${DATA.built} · ` : '';
}
function renderBoard(p) {
  $('#b-name').textContent = p.name;
  $('#b-add').textContent = `添加到“${p.name}”`;
  const all = VIDS.filter(v => v.category === p.cat), mine = all.filter(v => v.custom), built = all.filter(v => !v.custom);
  $('#b-mine').innerHTML = mine.length ? `<div class="adm-gh">我加的</div><div class="adm-group">${mine.map(v => `<div class="adm-row"><a class="l" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(v.kidTitle)}<small>${esc(v.ep ? 'ep' + v.ep : v.bvid + (v.page > 1 ? ' 第' + v.page + 'P' : ''))} · ${esc(mins(v.duration))}</small></a><button type="button" class="trash" data-del-vid="${esc(v.id)}" aria-label="删除">${ic('trash')}</button></div>`).join('')}</div>` : '';
  $('#b-built-h').textContent = `内置（${built.length}）`;
  $('#b-built').innerHTML = built.map(v => `<a class="adm-row" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer"><span class="l">${esc(v.kidTitle || v.title)}<small>${esc(v.channel)} · ${esc(mins(v.duration))}${v.caution ? ' · ' + esc(v.caution) : ''}</small></span><svg class="ic chev"><use href="#i-chev"/></svg></a>`).join('');
}
function boardMsg(t, cls) { const m = $('#b-msg'); m.textContent = t; m.className = 'adm-foot' + (cls ? ' ' + cls : ''); }
// 同一个视频的统一写法：BV 号（第 2P 起加 -pN）或 epN，用来查重
function vidKey(v) {
  if (v.ep) return 'ep' + v.ep;
  const id = String(v.id).replace(/^u-/, ''), pm = id.match(/-p(\d+)$/);
  const page = v.page || (pm ? +pm[1] : 1);
  return (v.bvid || id.replace(/-p\d+$/, '')) + (page > 1 ? '-p' + page : '');
}
// 认 B 站视频网址（含 ?p= 分P）、BV 号、番剧单集 ep 号
function parseLink(raw) {
  const t = (raw || '').trim();
  if (/b23\.tv/i.test(t)) return {err: '这是短链接，请先在浏览器打开，再复制地址栏里的网址。'};
  const bv = t.match(/BV[0-9A-Za-z]{10}/);
  if (bv) { const pm = t.match(/[?&]p=(\d+)/); return {bvid: bv[0], page: pm ? +pm[1] : 1}; }
  const ep = t.match(/\bep(\d{3,})/i);
  if (ep) return {ep: ep[1]};
  return {err: '没认出视频：请粘贴 B 站视频网址或 BV 号。'};
}
$('#b-form').onsubmit = e => {
  e.preventDefault();
  const p = placeById[current.arg]; if (!p || !admOpen) return;
  const L = parseLink($('#b-url').value); if (L.err) return boardMsg(L.err, 'err');
  const title = $('#b-title').value.trim(); if (!title) return boardMsg('请填一个孩子看得懂的标题。', 'err');
  const m = +$('#b-dur').value; if (!(m >= 1 && m <= 300)) return boardMsg('请填时长（分钟），用来在快播完时盖住 B 站推荐。', 'err');
  const key = L.ep ? 'ep' + L.ep : L.bvid + (L.page > 1 ? '-p' + L.page : '');
  const dup = VIDS.find(v => vidKey(v) === key);
  if (dup) return boardMsg(`这个视频已经在“${placeOf(dup).name}”里了。`, 'err');
  const url = L.ep ? `https://www.bilibili.com/bangumi/play/ep${L.ep}` : `https://www.bilibili.com/video/${L.bvid}${L.page > 1 ? '?p=' + L.page : ''}`;
  const v = {id: 'u-' + key, custom: true, category: p.cat, title, kidTitle: title, duration: Math.round(m * 60), url, channel: '控制面板添加', channelUrl: url, cover: `assets/place-${p.id}.webp`, added: Date.now()};
  if (L.ep) v.ep = L.ep; else { v.bvid = L.bvid; if (L.page > 1) v.page = L.page; }
  customs.push(v); store.set(CUSTOM_KEY, customs); VIDS.unshift(v); byId[v.id] = v;
  $('#b-form').reset(); renderBoard(p); boardMsg(`加好了。回岛上点开播一下，确认能放。`, 'ok');
};
$('#b-mine').onclick = e => {
  const b = e.target.closest('[data-del-vid]'); if (!b) return;
  const v = byId[b.dataset.delVid]; if (!v || !confirm(`删掉“${v.kidTitle}”？`)) return;
  customs = customs.filter(x => x.id !== v.id); store.set(CUSTOM_KEY, customs);
  VIDS.splice(VIDS.indexOf(v), 1); delete byId[v.id];
  renderBoard(placeById[current.arg]); toast('删掉了');
};

// ---------- 档案备份：探索本的东西自动传一份到家里电脑（经个人 Tailscale，外人连不上） ----------
// 孩子在探索本里删掉的，家里那份不删。连不上时留在 iPad 上，下次连上自动补传。
const ARCHIVE = 'https://island-archive.tail4e3d48.ts.net';
const DEV_KEY = 'island-device-v1', SYNC_KEY = 'island-sync-v1';
let device = store.get(DEV_KEY, null);
if (!device) { device = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); store.set(DEV_KEY, device); }
const syncInfo = store.get(SYNC_KEY, {last: 0, err: '', count: 0});
let syncing = null;
async function rawWorks() { const d = await db(); return new Promise((res, rej) => { const r = d.transaction('works').objectStore('works').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function markSynced(w) { const d = await db(); await new Promise(res => { const tx = d.transaction('works', 'readwrite'); tx.objectStore('works').put({...w, synced: Date.now()}); tx.oncomplete = res; tx.onerror = res; }); }
function afetch(path, opt = {}) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 30000);
  return fetch(ARCHIVE + path, {...opt, signal: c.signal, headers: {'X-Device': device, ...(opt.headers || {})}}).finally(() => clearTimeout(t));
}
function syncNow() {
  if (syncing) return syncing;
  syncing = (async () => {
    try {
      for (const w of (await rawWorks()).filter(w => w.buf && !w.synced)) {
        const meta = {type: w.type, kind: w.kind || '', label: w.label || '', place: w.place || '', at: w.at, mime: w.mime || ''};
        const r = await afetch('/api/work', {method: 'POST', headers: {'X-Id': String(w.id), 'X-Meta': encodeURIComponent(JSON.stringify(meta)), 'Content-Type': 'application/octet-stream'}, body: w.buf});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        await markSynced(w);
      }
      const st = await afetch('/api/state', {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({likes, helped, visited, customs, tset, at: Date.now()})});
      if (!st.ok) throw new Error('HTTP ' + st.status);
      const p = await (await afetch('/api/ping?device=' + device)).json();
      Object.assign(syncInfo, {last: Date.now(), err: '', count: p.count || 0});
    } catch (e) { syncInfo.err = e.name === 'AbortError' ? 'timeout' : (e.message || 'fail'); }
    store.set(SYNC_KEY, syncInfo); syncing = null;
    if (current.view === 'grownup' && admOpen) paintSync();
  })();
  return syncing;
}
const whenText = t => { if (!t) return '还没有'; const d = new Date(t), now = new Date(), hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; return d.toDateString() === now.toDateString() ? `今天 ${hm}` : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`; };
async function paintSync() {
  let pending = 0; try { pending = (await rawWorks()).filter(w => w.buf && !w.synced).length; } catch {}
  $('#s-count').textContent = `${syncInfo.count || 0} 件${pending ? `，还有 ${pending} 件没传` : ''}`;
  $('#s-last').textContent = syncing ? '正在备份…' : whenText(syncInfo.last);
  const f = $('#s-foot');
  f.className = 'adm-foot' + (syncInfo.err ? ' err' : '');
  f.textContent = syncInfo.err ? '连不上家里电脑：确认这台 iPad 的 Tailscale 开着、家里电脑开着。没传的先留在 iPad 上，连上后自动补传。' : '照片、录音和问题会自动传一份到家里电脑永久保存；在探索本里删掉的，家里那份不删。';
}
$('#s-now').onclick = async () => { const p = syncNow(); paintSync(); await p; toast(syncInfo.err ? '没连上家里电脑' : '备份好了', syncInfo.err ? 'x' : 'check'); };
setTimeout(() => syncNow(), 4000);
setInterval(() => syncNow(), 10 * 60e3);
window.addEventListener('online', () => syncNow());
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });

// 在这台设备上存一份（sw.js）：之后打开直接从本机读，网页更新时只下载变了的文件
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} });
}

route();
</script>
